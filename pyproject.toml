[project]
name = "privacybrick-api"
version = "0.1.0"
description = "Local control-plane API for the PrivacyBrick Raspberry Pi DNS privacy appliance"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "zeroconf>=0.132",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
privacybrick-api = "privacybrick_api.main:main"
privacybrick-pair = "privacybrick_api.pair_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["privacybrick_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
